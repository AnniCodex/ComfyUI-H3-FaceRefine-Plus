[project]
name = "comfyui-h3-facerefine-plus"
description = "Add-on nodes for ComfyUI-H3-FaceRefine (MiniMax H3 video face refiner, required). v0.2.0: GPU Flow Lock and Tone Match (2.7x faster pipeline), one Mode dropdown for V1 (prompt + 3 refs) or V2 (SAM3 face mask, optional VOSR2), default strength 0.30. Also Stitch Plus and super-resolved face crops. Side-by-side tests: https://annicodex.github.io/FaceRefine-Plus-Tests/"
version = "0.2.0"
license = { file = "LICENSE" }
dependencies = ["opencv-python>=4.7"]

[project.urls]
Repository = "https://github.com/AnniCodex/ComfyUI-H3-FaceRefine-Plus"

